<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM 03 · Multi-turn Messages</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="chat-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">LLM 03 · Multi-turn Messages</p>
            <h1>最小多轮对话</h1>
            <p class="subtitle">历史只保存在当前页面内存中。刷新页面，对话立即消失。</p>
          </div>
          <button id="clearButton" class="secondary-button" type="button">清空</button>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <strong>从一句话开始。</strong>
            <span>例如：我叫魏福万，请记住。然后再问：我叫什么？</span>
          </div>
        </div>

        <form id="chatForm" class="composer">
          <textarea
            id="promptInput"
            rows="3"
            placeholder="输入消息，Enter 发送，Shift + Enter 换行"
            autofocus
          ></textarea>
          <div class="composer-footer">
            <span id="statusText">浏览器 messages: 0</span>
            <button id="sendButton" type="submit">发送</button>
          </div>
        </form>
      </section>

      <aside class="debug-panel">
        <div class="debug-header">
          <div>
            <p class="eyebrow">Learning View</p>
            <h2>当前 messages</h2>
          </div>
          <span class="memory-badge">仅内存</span>
        </div>
        <p class="debug-tip">
          每次请求都会把这里的全部 <code>user / assistant</code> 消息重新发给后端。
        </p>
        <pre id="messagesJson">[]</pre>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
